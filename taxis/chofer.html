    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interfaz Chofer - Rutas Pemex</title>
    <!-- Importar Leaflet para los mapas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .header { background-color: #30363d; text-align: center; padding: 12px; font-size: 18px; font-weight: bold; letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; border-radius: 6px; }
        .mensaje-vacio { text-align: center; color: #8b949e; margin-top: 50px; font-style: italic; }
        
        /* Contenedor del Mapa */
        #map-container {
            width: 100%;
            height: 40vh; /* Ocupa el 40% de la pantalla del celular */
            border-radius: 8px;
            margin-bottom: 20px;
            display: none; /* Oculto hasta que haya ruta */
            border: 2px solid #30363d;
            box-sizing: border-box;
            z-index: 1;
        }
        #map { height: 100%; width: 100%; border-radius: 6px; z-index: 1;}
        /* Filtro para hacer el mapa oscuro */
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }

        .card { background-color: #30363d; position: relative; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-left: 4px solid #4CAF50; transition: 0.3s; border-radius: 6px;}
        .card.encola { border-left: 4px solid #8b949e; opacity: 0.6; } 
        
        .ruta-id { font-size: 14px; color: #8b949e; margin-bottom: 15px; }
        .btn-terminar { position: absolute; top: 0; right: 0; background-color: #4CAF50; color: white; border: none; padding: 15px 20px; font-weight: bold; font-size: 14px; cursor: pointer; height: 100%; border-radius: 0 6px 6px 0;}
        .btn-terminar:active { background-color: #45a049; }
        .info-line { display: flex; align-items: center; margin-bottom: 12px; font-size: 15px; padding-right: 110px; }
        .card.encola .info-line { padding-right: 0px; } 
        .info-line span { margin-right: 10px; color: #8b949e; font-size: 12px; text-transform: uppercase;}
        .dots { flex-grow: 1; border-bottom: 1px dashed #8b949e; margin-left: 5px; min-width: 20px; }
        .text-value { margin-left: 10px; font-weight: bold; color: #fff; text-align: right; max-width: 60%; font-size: 13px;}
    </style>
</head>
<body>

    <div class="header" id="headerTaxi"># CARGANDO...</div>

    <!-- El mapa en vivo del chofer -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <div id="contenedorViaje">
        <div class="mensaje-vacio">Buscando viajes asignados...</div>
    </div>

    <script>
        const ORS_API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjBhZjE5MTEyYWJlYzQ2ZmJiZDFhMjkwNjc0ZDk0ZDdlIiwiaCI6Im11cm11cjY0In0=";
        const urlParams = new URLSearchParams(window.location.search);
        const taxiId = urlParams.get('id') ? parseInt(urlParams.get('id')) : null;

        // Variables del mapa del chofer
        let map = null;
        let routeLayer = null;
        let markers = [];
        let currentViajeActivoId = null; // Para evitar redibujar la misma ruta cada 4 segundos

        const goldIcon = new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] });
        const blueIcon = new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] });

        if (!taxiId) {
            document.getElementById('headerTaxi').innerText = "ERROR: ID NO DEFINIDO";
            document.getElementById('contenedorViaje').innerHTML = "<div class='mensaje-vacio'>Por favor, ingresa con tu enlace personal.</div>";
        } else {
            document.getElementById('headerTaxi').innerText = `# CAMIÓN  ${taxiId < 10 ? '0'+taxiId : taxiId}`;
            cargarViajeActivo();
            setInterval(cargarViajeActivo, 4000); 
        }

        async function cargarViajeActivo() {
            if (!taxiId) return;

            try {
                const response = await fetch('/taxis');
                const taxis = await response.json();
                const miTaxi = taxis.find(t => parseInt(t.id) === parseInt(taxiId));    
                const contenedor = document.getElementById('contenedorViaje');
                const mapContainer = document.getElementById('map-container');

                if (miTaxi && miTaxi.viajes && miTaxi.viajes.length > 0) {
                    let htmlContent = '';
                    
                    // Recorremos la cola
                    miTaxi.viajes.forEach((viaje, index) => {
                        const esActual = index === 0;
                        const numRuta = viaje.id.toString().padStart(6, '0');
                            
                        // Si es el viaje actual, mostrar mapa y trazar ruta si es nuevo
                        if (esActual) {
                            mapContainer.style.display = 'block';
                            if (currentViajeActivoId !== viaje.id) {
                                currentViajeActivoId = viaje.id;
                                drawDriverRoute(viaje.origen_lat, viaje.origen_lng, viaje.dest_lat, viaje.dest_lng);
                            }
                        }

                        const claseCard = esActual ? 'card' : 'card encola';
                        const badge = esActual ? '<span style="float:right; background:#4CAF50; color:#fff; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:bold;">EN RUTA</span>' : '<span style="float:right; background:#8b949e; color:#0d1117; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:bold;">EN COLA</span>';

                        const botonHTML = esActual ? `<button class="btn-terminar" onclick="terminarViaje(${viaje.id})">TERMINAR</button>` : '';

                        htmlContent += `
                            <div class="${claseCard}">
                                <div class="ruta-id">Ruta #${numRuta} ${badge}</div>
                                <div class="info-line">
                                    <span>Punto A</span><div class="dots"></div><span class="text-value">${viaje.origen_texto.replace('🏢 SUCURSAL: ', '')}</span>
                                </div>
                                <div class="info-line">
                                    <span>Punto B</span><div class="dots"></div><span class="text-value">${viaje.destino_texto.replace('🏢 SUCURSAL: ', '')}</span>
                                </div>
                                ${botonHTML}
                            </div>
                        `;
                    });

                    contenedor.innerHTML = htmlContent;
                } else {
                    contenedor.innerHTML = `<div class="mensaje-vacio">No tienes viajes asignados.<br><br>Esperando al operador...</div>`;
                    mapContainer.style.display = 'none';
                    currentViajeActivoId = null;
                }
            } catch (error) {
                console.error("Error al cargar datos:", error);
            }
        }

        async function drawDriverRoute(startLat, startLng, endLat, endLng) {
            if (!map) {
                map = L.map('map').setView([startLat, startLng], 14);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
            }

            if (routeLayer) map.removeLayer(routeLayer);
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            let markerA = L.marker([startLat, startLng], {icon: goldIcon}).addTo(map).bindPopup("Inicio de Ruta");
            let markerB = L.marker([endLat, endLng], {icon: blueIcon}).addTo(map).bindPopup("Destino Final");
            markers.push(markerA, markerB);

            try {
                // 1. Descargar los bloqueos vigentes del servidor
                const resBloqueos = await fetch('/api/bloqueos');
                const dataBloqueos = await resBloqueos.json();
                const bloqueos = dataBloqueos.bloqueos || [];

                // 2. Preparar los datos para OpenRouteService
                let bodyData = {
                    coordinates: [[startLng, startLat], [endLng, endLat]],
                    format: "geojson"
                };

                // 3. Crear las zonas de exclusión si existen bloqueos
                if (bloqueos.length > 0) {
                    let avoidPolygons = [];
                    bloqueos.forEach(b => {
                        let pad = 0.0004; // Margen para abarcar la calle
                        let minLat = Math.min(b.b1Lat, b.b2Lat) - pad;
                        let maxLat = Math.max(b.b1Lat, b.b2Lat) + pad;
                        let minLng = Math.min(b.b1Lng, b.b2Lng) - pad;
                        let maxLng = Math.max(b.b1Lng, b.b2Lng) + pad;
                        avoidPolygons.push([[[minLng, minLat], [maxLng, minLat], [maxLng, maxLat], [minLng, maxLat], [minLng, minLat]]]);
                    });
                    bodyData.options = { avoid_polygons: { type: "MultiPolygon", coordinates: avoidPolygons } };
                }

                // 4. Solicitar ruta a ORS
                const response = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': ORS_API_KEY },
                    body: JSON.stringify(bodyData)
                });
                
                const data = await response.json();
                
                if(data.features && data.features.length > 0) {
                    routeLayer = L.geoJSON(data.features[0].geometry, { style: { color: '#4CAF50', weight: 6, opacity: 0.9 } }).addTo(map);
                    map.fitBounds(routeLayer.getBounds(), { padding: [30, 30] });
                }
            } catch (error) { console.error("Error al trazar ruta del chofer:", error); }
        }

        async function terminarViaje(idViaje) {
            try {
                await fetch('/complete_trip', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ taxi_id: parseInt(taxiId), viaje_id: idViaje })
                });
                // Recargar de inmediato
                cargarViajeActivo();
            } catch (error) {
                alert("Hubo un error de conexión al intentar terminar el viaje.");
            }
        }
    </script>
</body>
</html>
